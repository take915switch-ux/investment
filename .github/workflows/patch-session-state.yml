name: Add custom portfolio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-session-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("asset_data_test_app/app.py")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              if old not in source:
                  raise SystemExit(f"{label} block not found")
              source = source.replace(old, new, 1)

          helper_anchor = '''def allocation_table(weights: pd.Series) -> pd.DataFrame:
              allocation = (
                  weights.rename("配分比率")
                  .mul(100)
                  .reset_index()
                  .rename(columns={"index": "アセット"})
              )
              allocation["配分比率"] = allocation["配分比率"].round(2)
              return allocation
          '''
          helper_replacement = helper_anchor + '''

          def custom_portfolio_returns(
              returns: pd.DataFrame,
              weights: pd.Series,
              cash_annual_return: float,
              periods_per_year: int,
          ) -> tuple[pd.Series | None, list[str]]:
              risky_weights = weights.drop(labels=["現金"], errors="ignore")
              active_risky = risky_weights[risky_weights > 0].index.tolist()
              missing_assets = [name for name in active_risky if name not in returns.columns]
              if missing_assets:
                  return None, missing_assets

              if active_risky:
                  aligned_returns = returns[active_risky].dropna(how="any")
                  if aligned_returns.empty:
                      return None, []
                  portfolio = aligned_returns.mul(risky_weights[active_risky], axis=1).sum(axis=1)
              else:
                  aligned_returns = returns.dropna(how="all")
                  if aligned_returns.empty:
                      return None, []
                  portfolio = pd.Series(0.0, index=aligned_returns.index)

              cash_weight = float(weights.get("現金", 0.0))
              cash_period_return = (1 + cash_annual_return) ** (1 / periods_per_year) - 1
              portfolio = portfolio + cash_weight * cash_period_return
              portfolio.name = "指定配分"
              return portfolio, []
          '''
          if "def custom_portfolio_returns(" not in source:
              replace_once(helper_anchor, helper_replacement, "helper")

          sidebar_anchor = '''risk_free_rate = risk_free_rate_percent / 100

          default_start = date(2008, 3, 28)
          '''
          sidebar_replacement = '''risk_free_rate = risk_free_rate_percent / 100

          st.sidebar.subheader("指定ポートフォリオ")
          st.sidebar.caption("5項目の合計を100%にしてください。現金の利回りには無リスク金利を使います。")
          custom_spy = st.sidebar.number_input("S&P 500（%）", 0.0, 100.0, 20.0, 1.0)
          custom_gold = st.sidebar.number_input("金（%）", 0.0, 100.0, 20.0, 1.0)
          custom_bond = st.sidebar.number_input("米国総合債券（%）", 0.0, 100.0, 20.0, 1.0)
          custom_acwi = st.sidebar.number_input("全世界株式（%）", 0.0, 100.0, 20.0, 1.0)
          custom_cash = st.sidebar.number_input("現金（%）", 0.0, 100.0, 20.0, 1.0)
          custom_total = custom_spy + custom_gold + custom_bond + custom_acwi + custom_cash
          st.sidebar.metric("配分合計", f"{custom_total:.1f}%")
          custom_allocation_valid = abs(custom_total - 100.0) < 1e-9
          if not custom_allocation_valid:
              st.sidebar.warning("配分合計を100%にしてください。")

          custom_weights = pd.Series(
              {
                  "S&P 500 ETF (SPY)": custom_spy / 100,
                  "金 ETF (GLD)": custom_gold / 100,
                  "米国総合債券 ETF (AGG)": custom_bond / 100,
                  "全世界株式 ETF (ACWI)": custom_acwi / 100,
                  "現金": custom_cash / 100,
              },
              name="配分比率",
          )

          default_start = date(2008, 3, 28)
          '''
          if 'st.sidebar.subheader("指定ポートフォリオ")' not in source:
              replace_once(sidebar_anchor, sidebar_replacement, "sidebar")

          returns_anchor = '''        returns = prices.pct_change(fill_method=None)
                  maximum_sharpe = None
                  covariance = None
                  expected_returns = None
          '''
          returns_replacement = '''        returns = prices.pct_change(fill_method=None)
                  maximum_sharpe = None
                  covariance = None
                  expected_returns = None
                  custom_return_series = None
                  custom_missing_assets = []
                  custom_annual_return = None
                  custom_annual_risk = None

                  if custom_allocation_valid:
                      custom_return_series, custom_missing_assets = custom_portfolio_returns(
                          returns, custom_weights, risk_free_rate, periods_per_year
                      )
                      if custom_return_series is not None and len(custom_return_series) >= 2:
                          custom_annual_return = float(
                              custom_return_series.mean() * periods_per_year
                          )
                          custom_annual_risk = float(
                              custom_return_series.std() * np.sqrt(periods_per_year)
                          )

                  if custom_missing_assets:
                      st.warning(
                          "指定配分に含まれる次の資産を取得対象に追加してください: "
                          + "、".join(custom_missing_assets)
                      )
          '''
          if "custom_return_series = None" not in source:
              replace_once(returns_anchor, returns_replacement, "returns setup")

          graph_anchor = '''                frontier_fig.add_trace(
                              go.Scatter(
                                  x=asset_risks,
                                  y=asset_returns,
                                  mode="markers+text",
                                  text=list(expected_returns.index),
                                  textposition="top center",
                                  name="各アセット",
                              )
                          )

                          if maximum_sharpe is not None:
          '''
          graph_replacement = '''                frontier_fig.add_trace(
                              go.Scatter(
                                  x=asset_risks,
                                  y=asset_returns,
                                  mode="markers+text",
                                  text=list(expected_returns.index),
                                  textposition="top center",
                                  name="各アセット",
                              )
                          )

                          if custom_annual_return is not None and custom_annual_risk is not None:
                              frontier_fig.add_trace(
                                  go.Scatter(
                                      x=[custom_annual_risk * 100],
                                      y=[custom_annual_return * 100],
                                      mode="markers+text",
                                      text=["指定配分"],
                                      textposition="bottom center",
                                      marker={"size": 14, "symbol": "diamond"},
                                      name="指定配分",
                                  )
                              )

                          if maximum_sharpe is not None:
          '''
          if 'text=["指定配分"]' not in source:
              replace_once(graph_anchor, graph_replacement, "frontier point")

          chart_anchor = '''                st.plotly_chart(frontier_fig, use_container_width=True)

                          if maximum_sharpe is not None:
          '''
          chart_replacement = '''                st.plotly_chart(frontier_fig, use_container_width=True)

                          if custom_annual_return is not None and custom_annual_risk is not None:
                              st.subheader("指定ポートフォリオ")
                              custom_col1, custom_col2 = st.columns(2)
                              custom_col1.metric("推定年平均リターン", f"{custom_annual_return:.2%}")
                              custom_col2.metric("推定年率リスク", f"{custom_annual_risk:.2%}")
                              custom_display = custom_weights.rename("配分比率").mul(100).reset_index()
                              custom_display.columns = ["アセット", "配分比率"]
                              st.dataframe(
                                  custom_display.style.format({"配分比率": "{:.1f}%"}),
                                  use_container_width=True,
                                  hide_index=True,
                              )

                          if maximum_sharpe is not None:
          '''
          if 'st.subheader("指定ポートフォリオ")' not in source[source.find('st.subheader("効率的フロンティア")'):]:
              replace_once(chart_anchor, chart_replacement, "custom metrics")

          options_anchor = '''                if maximum_sharpe is not None:
                                  portfolio_options.append("シャープレシオ最大")
                              simulation_portfolio = st.radio(
          '''
          options_replacement = '''                if maximum_sharpe is not None:
                                  portfolio_options.append("シャープレシオ最大")
                              if custom_return_series is not None and len(custom_return_series) >= 12:
                                  portfolio_options.append("指定配分")
                              simulation_portfolio = st.radio(
          '''
          if 'portfolio_options.append("指定配分")' not in source:
              replace_once(options_anchor, options_replacement, "MC option")

          calculation_anchor = '''        if simulation_portfolio == "S&P 500のみ":
                      simulation_returns = returns[["S&P 500 ETF (SPY)"]].dropna()
                  elif simulation_portfolio == "ACWIのみ":
                      simulation_returns = returns[["全世界株式 ETF (ACWI)"]].dropna()
                  else:
                      simulation_returns = returns.dropna(how="any")

                  if len(simulation_returns) >= 12:
                      if simulation_portfolio == "シャープレシオ最大" and maximum_sharpe is not None:
                          simulation_weights = maximum_sharpe[0].reindex(
                              simulation_returns.columns
                          ).fillna(0)
                      else:
                          simulation_weights = pd.Series(
                              1 / simulation_returns.shape[1], index=simulation_returns.columns
                          )

                      portfolio_return_series = simulation_returns @ simulation_weights
          '''
          calculation_replacement = '''        if simulation_portfolio == "指定配分":
                      portfolio_return_series = custom_return_series.dropna()
                  else:
                      if simulation_portfolio == "S&P 500のみ":
                          simulation_returns = returns[["S&P 500 ETF (SPY)"]].dropna()
                      elif simulation_portfolio == "ACWIのみ":
                          simulation_returns = returns[["全世界株式 ETF (ACWI)"]].dropna()
                      else:
                          simulation_returns = returns.dropna(how="any")

                      if simulation_portfolio == "シャープレシオ最大" and maximum_sharpe is not None:
                          simulation_weights = maximum_sharpe[0].reindex(
                              simulation_returns.columns
                          ).fillna(0)
                      else:
                          simulation_weights = pd.Series(
                              1 / simulation_returns.shape[1], index=simulation_returns.columns
                          )
                      portfolio_return_series = simulation_returns @ simulation_weights

                  if len(portfolio_return_series) >= 12:
          '''
          if 'simulation_portfolio == "指定配分"' not in source:
              replace_once(calculation_anchor, calculation_replacement, "MC calculation")

          compile(source, str(path), "exec")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset_data_test_app/app.py
          git commit -m "Add configurable portfolio analysis"
          git push
